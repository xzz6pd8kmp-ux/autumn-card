<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>秋日卡牌 · 生日诗签</title>
    <style>
        /* ===== 样式与之前完全一致 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
            background: #1e150f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow-x: hidden;
        }
        .app {
            position: relative;
            width: 100%;
            max-width: 420px;
            min-height: 720px;
            background: linear-gradient(165deg, #f7efe6 0%, #e8dccc 40%, #dac8b0 100%);
            border-radius: 40px;
            padding: 20px 18px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 245, 230, 0.3);
            overflow: hidden;
            backdrop-filter: blur(2px);
            transition: all 0.3s;
        }
        .leaf {
            position: absolute;
            pointer-events: none;
            opacity: 0.25;
            font-size: 28px;
            animation: leafFloat linear infinite;
            z-index: 0;
        }
        .leaf:nth-child(1) { top: 5%; left: 2%; animation-duration: 14s; font-size: 32px; opacity: 0.2; }
        .leaf:nth-child(2) { top: 15%; right: 0%; animation-duration: 18s; font-size: 24px; opacity: 0.18; animation-delay: -3s; }
        .leaf:nth-child(3) { bottom: 20%; left: 0%; animation-duration: 16s; font-size: 36px; opacity: 0.15; animation-delay: -7s; }
        .leaf:nth-child(4) { bottom: 5%; right: 2%; animation-duration: 20s; font-size: 28px; opacity: 0.2; animation-delay: -11s; }
        .leaf:nth-child(5) { top: 45%; left: 85%; animation-duration: 22s; font-size: 20px; opacity: 0.12; animation-delay: -5s; }
        @keyframes leafFloat {
            0% { transform: translate(0,0) rotate(0deg) scale(1); }
            25% { transform: translate(18px,30px) rotate(12deg) scale(1.05); }
            50% { transform: translate(-6px,60px) rotate(-8deg) scale(0.95); }
            75% { transform: translate(22px,90px) rotate(15deg) scale(1.02); }
            100% { transform: translate(0px,120px) rotate(0deg) scale(1); }
        }
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            width: 100%;
            animation: fadeIn 0.6s ease;
        }
        .page.active { display: flex; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .home-page { padding-top: 18px; gap: 10px; }
        .home-page .kv-icon { font-size: 52px; margin-bottom: 2px; filter: drop-shadow(0 8px 20px rgba(180,120,70,0.25)); }
        .home-page .main-title { font-size: 34px; font-weight: 700; color: #3d2a1b; letter-spacing: 8px; text-shadow: 0 2px 12px rgba(180,130,80,0.2); margin-bottom: 2px; }
        .home-page .sub-title { font-size: 16px; color: #6b4f38; letter-spacing: 2px; font-weight: 400; opacity: 0.85; margin-bottom: 18px; }
        .glass-card {
            width: 100%;
            background: rgba(255,248,240,0.5);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border-radius: 28px;
            padding: 28px 22px 30px;
            box-shadow: 0 12px 40px rgba(80,50,30,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid rgba(255,240,225,0.35);
            transition: all 0.3s;
        }
        .input-group { display: flex; flex-direction: column; gap: 18px; }
        .input-label { font-size: 15px; color: #4d3727; font-weight: 500; letter-spacing: 1px; text-align: center; }
        .birth-input-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255,245,235,0.5);
            border-radius: 18px;
            padding: 6px 16px;
            border: 1px solid rgba(200,170,145,0.3);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .birth-input-wrap:focus-within { border-color: #c49a7a; box-shadow: 0 0 0 4px rgba(196,154,122,0.15); }
        .birth-input-wrap .prefix { font-size: 18px; color: #7a5f48; font-weight: 500; opacity: 0.6; }
        #birthInput {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 28px;
            font-weight: 600;
            font-family: "Noto Serif SC", serif;
            color: #3d2a1b;
            text-align: center;
            padding: 10px 4px;
            outline: none;
            letter-spacing: 6px;
            min-width: 0;
            width: 100%;
        }
        #birthInput::placeholder { color: #b99a82; font-weight: 300; font-size: 18px; letter-spacing: 3px; opacity: 0.5; }
        .birth-input-wrap .suffix { font-size: 16px; color: #7a5f48; opacity: 0.5; font-weight: 400; }
        .hint-text { font-size: 13px; color: #9a7a64; text-align: center; margin-top: -6px; letter-spacing: 0.5px; }
        .error-text { color: #c0392b; font-size: 14px; text-align: center; min-height: 24px; margin-top: -4px; font-weight: 500; opacity: 0; transition: opacity 0.3s; }
        .error-text.show { opacity: 1; }
        .btn-primary {
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #d4a67a, #b8825a);
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 28px rgba(184,130,90,0.35);
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(184,130,90,0.45); }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s;
            pointer-events: none;
        }
        .btn-primary:hover:not(:disabled)::after { opacity: 1; }
        .cards-page { padding-top: 8px; gap: 14px; min-height: 600px; justify-content: flex-start; }
        .cards-page .page-header { font-size: 18px; color: #4d3727; font-weight: 500; letter-spacing: 2px; opacity: 0.7; margin-bottom: 4px; }
        .cards-page .page-header span { font-weight: 700; color: #8b6548; opacity: 1; }
        .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 360px; margin: 0 auto; }
        .card-container { perspective: 800px; aspect-ratio: 4/5; width: 100%; cursor: default; position: relative; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.23,1,0.32,1); transform-style: preserve-3d; border-radius: 18px; box-shadow: 0 6px 24px rgba(60,40,25,0.15); }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 10px; text-align: center; overflow: hidden; border: 1px solid rgba(255,245,235,0.3); }
        .card-back {
            background: linear-gradient(145deg, #8b6f56, #6d4f3a);
            transform: rotateY(0deg);
            box-shadow: inset 0 2px 20px rgba(0,0,0,0.15);
            border: 1px solid rgba(200,170,145,0.2);
            background-image: radial-gradient(circle at 20% 30%, rgba(220,190,160,0.15) 0%, transparent 50%), repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(200,170,145,0.04) 8px, rgba(200,170,145,0.04) 9px);
        }
        .card-back .back-pattern { font-size: 40px; opacity: 0.25; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2)); display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .card-back .back-pattern .small { font-size: 18px; opacity: 0.5; letter-spacing: 4px; font-weight: 300; }
        .card-back .card-index { position: absolute; bottom: 12px; right: 14px; font-size: 13px; color: rgba(255,235,210,0.3); font-weight: 300; letter-spacing: 2px; }
        .card-front {
            background: linear-gradient(160deg, #fcf4ea, #f0e2d0);
            transform: rotateY(180deg);
            border: 1px solid rgba(255,240,225,0.5);
            box-shadow: inset 0 0 40px rgba(200,170,145,0.08);
            padding: 14px 10px;
        }
        .card-front .card-label { font-size: 12px; color: #a88872; letter-spacing: 2px; font-weight: 400; opacity: 0.6; margin-bottom: 4px; border-bottom: 1px solid rgba(180,150,130,0.15); padding-bottom: 4px; width: 60%; }
        .card-front .card-content { font-size: 20px; font-weight: 600; color: #3d2a1b; line-height: 1.5; flex: 1; display: flex; align-items: center; justify-content: center; word-break: break-word; padding: 4px 2px; }
        .card-front .card-content.small { font-size: 15px; font-weight: 500; line-height: 1.6; letter-spacing: 0.5px; }
        .card-badge { position: absolute; top: -6px; right: -6px; background: rgba(180,130,90,0.85); backdrop-filter: blur(6px); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); z-index: 5; opacity: 0; transition: opacity 0.5s 0.5s; }
        .card-badge.show { opacity: 1; }
        .poem-reveal {
            width: 100%;
            max-width: 360px;
            margin: 10px auto 0;
            padding: 18px 20px 16px;
            background: rgba(255,248,240,0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 22px;
            border: 1px solid rgba(255,240,225,0.3);
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            transition: all 0.7s cubic-bezier(0.23,1,0.32,1);
            box-shadow: 0 8px 32px rgba(80,50,30,0.08);
            text-align: center;
        }
        .poem-reveal.show { opacity: 1; transform: translateY(0) scale(1); }
        .poem-reveal .poem-lines { font-size: 17px; line-height: 2; color: #3d2a1b; font-weight: 500; letter-spacing: 1px; }
        .poem-reveal .poem-lines .line { display: block; }
        .poem-reveal .poem-lines .line:last-child { color: #8b6548; font-weight: 600; }
        .poem-reveal .poem-birth { margin-top: 10px; font-size: 14px; color: #a88872; letter-spacing: 3px; font-weight: 400; border-top: 1px dashed rgba(180,150,130,0.2); padding-top: 10px; }
        .result-actions { display: flex; gap: 12px; width: 100%; max-width: 360px; margin: 12px auto 0; flex-wrap: wrap; justify-content: center; }
        .result-actions .btn-secondary {
            flex: 1;
            min-width: 100px;
            padding: 14px 0;
            border: none;
            border-radius: 60px;
            background: rgba(255,248,240,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #4d3727;
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(200,170,145,0.2);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        .result-actions .btn-secondary:hover { background: rgba(255,248,240,0.85); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(80,50,30,0.1); }
        .result-actions .btn-secondary:active { transform: scale(0.97); }
        .result-actions .btn-secondary.primary { background: linear-gradient(135deg, #d4a67a, #b8825a); color: #fff; border-color: transparent; box-shadow: 0 6px 24px rgba(184,130,90,0.3); }
        .result-actions .btn-secondary.primary:hover { box-shadow: 0 10px 32px rgba(184,130,90,0.4); }
        .poster-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20,14,10,0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }
        .poster-overlay.active { display: flex; }
        .poster-modal { position: relative; max-width: 380px; width: 100%; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6); animation: scaleIn 0.5s cubic-bezier(0.23,1,0.32,1); }
        @keyframes scaleIn { 0% { transform: scale(0.85) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .poster-modal canvas { display: block; width: 100%; height: auto; border-radius: 28px; }
        .poster-close {
            position: absolute;
            top: 14px; right: 14px;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .poster-close:hover { background: rgba(0,0,0,0.6); transform: rotate(90deg); }
        .poster-actions {
            display: flex;
            gap: 12px;
            padding: 16px 18px 18px;
            background: rgba(255,248,240,0.95);
            backdrop-filter: blur(12px);
            border-radius: 0 0 28px 28px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .poster-actions .btn-sm {
            flex: 1;
            min-width: 90px;
            padding: 12px 0;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(200,180,165,0.2);
            color: #3d2a1b;
            border: 1px solid rgba(180,150,130,0.15);
        }
        .poster-actions .btn-sm:hover { background: rgba(200,180,165,0.35); }
        .poster-actions .btn-sm.primary { background: linear-gradient(135deg, #d4a67a, #b8825a); color: #fff; border-color: transparent; }
        .poster-actions .btn-sm.primary:hover { box-shadow: 0 6px 24px rgba(184,130,90,0.35); }
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(30,20,15,0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #f0e4d8;
            padding: 14px 30px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 1px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 9999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.23,1,0.32,1);
            pointer-events: none;
            border: 1px solid rgba(255,245,230,0.08);
            max-width: 85%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .hidden { display: none !important; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .gap-6 { gap: 6px; }
        @media (max-width: 420px) {
            .app { padding: 16px 14px 22px; border-radius: 28px; min-height: 640px; }
            .home-page .main-title { font-size: 28px; letter-spacing: 6px; }
            .home-page .kv-icon { font-size: 40px; }
            .glass-card { padding: 22px 16px 24px; border-radius: 22px; }
            #birthInput { font-size: 24px; padding: 8px 2px; letter-spacing: 4px; }
            .btn-primary { font-size: 17px; padding: 14px 0; }
            .cards-grid { gap: 10px; }
            .card-front .card-content { font-size: 17px; }
            .card-front .card-content.small { font-size: 13px; }
            .poem-reveal .poem-lines { font-size: 15px; line-height: 1.9; }
            .result-actions .btn-secondary { font-size: 14px; padding: 12px 0; min-width: 80px; }
        }
        @media (max-width: 360px) {
            .app { padding: 12px 10px 16px; border-radius: 24px; }
            .home-page .main-title { font-size: 24px; letter-spacing: 4px; }
            .glass-card { padding: 16px 12px 18px; }
            #birthInput { font-size: 20px; letter-spacing: 3px; }
            .cards-grid { gap: 8px; }
            .card-front .card-content { font-size: 15px; }
            .card-front .card-content.small { font-size: 12px; }
            .poem-reveal .poem-lines { font-size: 14px; }
        }
        .loading-dots::after { content: '...'; animation: dots 1.2s steps(4, end) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; } }
        .glow { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; opacity: 0.2; z-index: 1; }
        .glow.g1 { width: 200px; height: 200px; background: #dbb68c; top: -60px; right: -40px; }
        .glow.g2 { width: 160px; height: 160px; background: #c9a77b; bottom: -40px; left: -30px; }
        .glow.g3 { width: 120px; height: 120px; background: #e8c9a8; top: 40%; right: -20px; opacity: 0.12; }
        ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="app" id="app">

        <div class="glow g1"></div>
        <div class="glow g2"></div>
        <div class="glow g3"></div>

        <div class="leaf">🍂</div>
        <div class="leaf">🍁</div>
        <div class="leaf">🍂</div>
        <div class="leaf">🍁</div>
        <div class="leaf">🍂</div>

        <!-- 首页 -->
        <div class="page home-page active" id="homePage">
            <div class="kv-icon">🍁</div>
            <div class="main-title">秋日卡牌</div>
            <div class="sub-title">输入生日，翻开属于你的秋日诗签</div>
            <div class="glass-card">
                <div class="input-group">
                    <div class="input-label">📅 你的生日（月日）</div>
                    <div class="birth-input-wrap">
                        <span class="prefix">📖</span>
                        <input type="text" id="birthInput" placeholder="0817" maxlength="4" inputmode="numeric" autocomplete="off" />
                        <span class="suffix">· 四位数</span>
                    </div>
                    <div class="hint-text">例：0101 · 0817 · 1225</div>
                    <div class="error-text" id="errorText">请输入正确的生日（月日）</div>
                    <button class="btn-primary" id="startBtn">翻开秋日卡牌</button>
                </div>
            </div>
        </div>

        <!-- 翻牌页 -->
        <div class="page cards-page" id="cardsPage">
            <div class="page-header">🍂 翻开你的 <span>秋日诗签</span></div>
            <div class="cards-grid" id="cardsGrid">
                <div class="card-container" data-index="0">
                    <div class="card-inner" id="cardInner0">
                        <div class="card-face card-back">
                            <div class="back-pattern">🍂<span class="small">✦ ✦ ✦</span></div>
                            <div class="card-index">①</div>
                        </div>
                        <div class="card-face card-front">
                            <div class="card-label">· 人 物 ·</div>
                            <div class="card-content" id="cardContent0">—</div>
                        </div>
                    </div>
                    <div class="card-badge" id="badge0">✦</div>
                </div>
                <div class="card-container" data-index="1">
                    <div class="card-inner" id="cardInner1">
                        <div class="card-face card-back">
                            <div class="back-pattern">🍁<span class="small">✦ ✦ ✦</span></div>
                            <div class="card-index">②</div>
                        </div>
                        <div class="card-face card-front">
                            <div class="card-label">· 场 景 ·</div>
                            <div class="card-content" id="cardContent1">—</div>
                        </div>
                    </div>
                    <div class="card-badge" id="badge1">✦</div>
                </div>
                <div class="card-container" data-index="2">
                    <div class="card-inner" id="cardInner2">
                        <div class="card-face card-back">
                            <div class="back-pattern">🍂<span class="small">✦ ✦ ✦</span></div>
                            <div class="card-index">③</div>
                        </div>
                        <div class="card-face card-front">
                            <div class="card-label">· 心 境 ·</div>
                            <div class="card-content" id="cardContent2">—</div>
                        </div>
                    </div>
                    <div class="card-badge" id="badge2">✦</div>
                </div>
                <div class="card-container" data-index="3">
                    <div class="card-inner" id="cardInner3">
                        <div class="card-face card-back">
                            <div class="back-pattern">🍁<span class="small">✦ ✦ ✦</span></div>
                            <div class="card-index">④</div>
                        </div>
                        <div class="card-face card-front">
                            <div class="card-label">· 诗 意 ·</div>
                            <div class="card-content small" id="cardContent3">—</div>
                        </div>
                    </div>
                    <div class="card-badge" id="badge3">✦</div>
                </div>
            </div>

            <div class="poem-reveal" id="poemReveal">
                <div class="poem-lines" id="poemLines"></div>
                <div class="poem-birth" id="poemBirth"></div>
            </div>

            <div class="result-actions" id="resultActions">
                <button class="btn-secondary" id="homeBtn">🏠 返回首页</button>
                <button class="btn-secondary primary" id="shareBtn">✨ 生成海报</button>
            </div>
        </div>
    </div>

    <!-- 海报弹窗 -->
    <div class="poster-overlay" id="posterOverlay">
        <div class="poster-modal">
            <button class="poster-close" id="posterClose">✕</button>
            <canvas id="posterCanvas" width="600" height="800"></canvas>
            <div class="poster-actions">
                <button class="btn-sm" id="downloadPoster">💾 保存图片</button>
                <button class="btn-sm primary" id="copyPoemBtn">📋 复制诗歌</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  词 库
        // ================================================================
        // 全部角色（用于随机）
        const ALL_CHARACTERS = [
            '旅人', '诗人', '追风的人', '造梦者', '拾光者',
            '听风者', '远行者', '花匠', '归来的少年', '云游者'
        ];
        // 固定映射（用于数字2-9）
        const CHARACTER_MAP = {
            '2': '追风的人', '3': '造梦者', '4': '拾光者',
            '5': '听风者', '6': '远行者', '7': '花匠',
            '8': '归来的少年', '9': '云游者'
        };

        // 场景词库（不变）
        const SCENE_MAP = {
            '0': '海边', '1': '清晨的小巷', '2': '晚风里',
            '3': '山野之间', '4': '雨后的街角', '5': '落叶纷飞时',
            '6': '森林深处', '7': '秋日原野', '8': '炊烟升起时',
            '9': '初雪来临前'
        };

        // ----- 心境候选分组 -----
        const MOOD_CANDIDATES = {
            '0': ['静静等待着', '心怀温柔的', '珍藏此刻的'],
            '1': ['轻轻想念着', '满怀期待的', '正向光而行'],
            '2': ['正心向远方', '正听风而立'],
            '3': ['轻声歌唱着', '奔赴热爱的']
        };
        // 默认池（用于 4-9 或未定义的数字）
        const DEFAULT_MOOD_POOL = [
            '静静等待着', '心怀温柔的', '轻轻想念着', '满怀期待的',
            '正心向远方', '正听风而立', '轻声歌唱着', '奔赴热爱的',
            '珍藏此刻的', '正向光而行'
        ];

        // 诗意结尾（不变）
        const ENDING_MAP = {
            '0': '去寻找远方，让脚步慢慢回应心之所向。',
            '1': '把一路风景，悄悄收进心里。',
            '2': '愿秋风轻轻吹过，也吹来久别重逢。',
            '3': '让每一次出发，都遇见温柔的风景。',
            '4': '去奔赴热爱，把平凡的日子走成诗。',
            '5': '把喜欢的时光，留给未来慢慢回味。',
            '6': '愿所有等待，都能与美好不期而遇。',
            '7': '让每一个今天，都成为值得珍藏的一天。',
            '8': '去拥抱秋天，让温柔落在每一个当下。',
            '9': '把心里的期待，轻轻放进秋天。'
        };

        // ================================================================
        //  状 态
        // ================================================================
        let state = {
            birth: '',
            digits: [],
            words: [], // [人物, 场景, 心境, 结尾]
            isFlipping: false,
            flippedCount: 0,
            isComplete: false,
            lastMood: null,   // 记录上一次选中的心境词，用于避免重复
        };

        const $ = id => document.getElementById(id);
        const homePage = $('homePage');
        const cardsPage = $('cardsPage');
        const birthInput = $('birthInput');
        const errorText = $('errorText');
        const startBtn = $('startBtn');
        const poemReveal = $('poemReveal');
        const poemLines = $('poemLines');
        const poemBirth = $('poemBirth');
        const resultActions = $('resultActions');
        const homeBtn = $('homeBtn');
        const shareBtn = $('shareBtn');
        const toast = $('toast');

        const cardInners = [
            $('cardInner0'), $('cardInner1'), $('cardInner2'), $('cardInner3')
        ];
        const cardContents = [
            $('cardContent0'), $('cardContent1'), $('cardContent2'), $('cardContent3')
        ];
        const badges = [
            $('badge0'), $('badge1'), $('badge2'), $('badge3')
        ];

        // ================================================================
        //  工 具 函 数
        // ================================================================

        function isValidDate(mmd) {
            if (!/^\d{4}$/.test(mmd)) return false;
            const month = parseInt(mmd.slice(0, 2), 10);
            const day = parseInt(mmd.slice(2, 4), 10);
            if (month < 1 || month > 12) return false;
            if (day < 1) return false;
            const daysInMonth = new Date(2000, month, 0).getDate();
            return day <= daysInMonth;
        }

        function formatBirth(mmd) {
            if (!mmd || mmd.length !== 4) return mmd;
            return mmd.slice(0, 2) + '.' + mmd.slice(2, 4);
        }

        let toastTimer = null;
        function showToast(msg, duration = 2200) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ================================================================
        //  核 心 逻 辑
        // ================================================================

        // 获取人物（第一位数字）
        function getCharacter(digit) {
            if (digit === '0' || digit === '1') {
                const idx = Math.floor(Math.random() * ALL_CHARACTERS.length);
                return ALL_CHARACTERS[idx];
            }
            return CHARACTER_MAP[digit] || '旅人';
        }

        // ----- 新增避免重复逻辑：getMood 会排除上次选中的词 -----
        function getMood(digit) {
            // 获取候选数组
            let candidates = MOOD_CANDIDATES[digit] || DEFAULT_MOOD_POOL;
            // 如果候选池只有一个词，直接返回，无法避免重复
            if (candidates.length === 1) {
                state.lastMood = candidates[0];
                return candidates[0];
            }
            // 过滤掉上次选中的词（如果有且候选池长度>1）
            let available = candidates;
            if (state.lastMood && candidates.includes(state.lastMood)) {
                available = candidates.filter(item => item !== state.lastMood);
                // 如果过滤后为空（理论上不会，因为长度>1），则回退到全部候选
                if (available.length === 0) {
                    available = candidates;
                }
            }
            // 从可用候选中随机选一个
            const selected = available[Math.floor(Math.random() * available.length)];
            state.lastMood = selected;
            return selected;
        }

        // 根据生日获取四个词
        function getWordsFromBirth(birth) {
            const digits = birth.split('');
            const character = getCharacter(digits[0]);
            const scene = SCENE_MAP[digits[1]] || '秋日原野';
            const mood = getMood(digits[2]);      // 新逻辑（含避免重复）
            const ending = ENDING_MAP[digits[3]] || '让每一个今天，都成为值得珍藏的一天。';
            return [character, scene, mood, ending];
        }

        // 构建诗句（第三句直接使用心境词，不加额外符号）
        function buildPoem(words) {
            return [
                `我是${words[0]}，`,
                `在${words[1]}，`,
                `${words[2]}`,
                `${words[3]}`
            ];
        }

        // 重置卡牌（保留lastMood，但允许新的随机）
        function resetCards() {
            cardInners.forEach((inner, i) => {
                inner.classList.remove('flipped');
                cardContents[i].textContent = '—';
                badges[i].classList.remove('show');
            });
            poemReveal.classList.remove('show');
            poemLines.innerHTML = '';
            poemBirth.textContent = '';
            state.flippedCount = 0;
            state.isComplete = false;
            state.isFlipping = false;
            resultActions.style.opacity = '0';
            resultActions.style.pointerEvents = 'none';
        }

        // 翻牌动画
        function flipCardsSequentially(words) {
            if (state.isFlipping) return;
            state.isFlipping = true;
            state.isComplete = false;
            state.flippedCount = 0;

            cardInners.forEach((inner, i) => {
                inner.classList.remove('flipped');
                cardContents[i].textContent = words[i] || '—';
                badges[i].classList.remove('show');
            });
            poemReveal.classList.remove('show');
            poemLines.innerHTML = '';
            poemBirth.textContent = '';
            resultActions.style.opacity = '0';
            resultActions.style.pointerEvents = 'none';

            const delay = 700;
            const total = cardInners.length;
            cardInners.forEach((inner, index) => {
                setTimeout(() => {
                    inner.classList.add('flipped');
                    setTimeout(() => {
                        badges[index].classList.add('show');
                    }, 300);
                    state.flippedCount = index + 1;
                    if (state.flippedCount === total) {
                        setTimeout(() => {
                            state.isComplete = true;
                            state.isFlipping = false;
                            showCompletePoem(words);
                            resultActions.style.opacity = '1';
                            resultActions.style.pointerEvents = 'auto';
                        }, 500);
                    }
                }, index * delay);
            });
        }

        function showCompletePoem(words) {
            const lines = buildPoem(words);
            poemLines.innerHTML = lines.map(l => `<span class="line">${l}</span>`).join('');
            poemBirth.textContent = `✦ 生日 · ${formatBirth(state.birth)} ✦`;
            poemReveal.classList.add('show');
        }

        function runExperience(birth) {
            state.birth = birth;
            state.digits = birth.split('');
            // 重置 lastMood，让新的体验重新开始避免重复
            state.lastMood = null;
            state.words = getWordsFromBirth(birth);

            homePage.classList.remove('active');
            cardsPage.classList.add('active');

            resetCards();
            cardContents.forEach((el, i) => {
                el.textContent = state.words[i] || '—';
            });

            setTimeout(() => {
                flipCardsSequentially(state.words);
            }, 400);
        }

        function goHome() {
            if (state.isFlipping) return;
            resetCards();
            state.birth = '';
            state.digits = [];
            state.words = [];
            state.isComplete = false;
            state.lastMood = null;   // 重置记忆
            cardsPage.classList.remove('active');
            homePage.classList.add('active');
            birthInput.value = '';
            startBtn.disabled = true;
            errorText.classList.remove('show');
            resultActions.style.opacity = '0';
            resultActions.style.pointerEvents = 'none';
            showToast('🏠 已返回首页');
        }

        // ================================================================
        //  海 报 生 成 (Canvas)
        // ================================================================

        function generatePoster(birth, words) {
            const canvas = $('posterCanvas');
            const ctx = canvas.getContext('2d');
            const W = 600, H = 800;

            const grad = ctx.createLinearGradient(0, 0, W * 0.6, H);
            grad.addColorStop(0, '#f7efe6');
            grad.addColorStop(0.4, '#ecdccb');
            grad.addColorStop(0.8, '#dac8b0');
            grad.addColorStop(1, '#c9b094');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const g1 = ctx.createRadialGradient(80, 100, 20, 80, 100, 300);
            g1.addColorStop(0, 'rgba(220,190,160,0.25)');
            g1.addColorStop(1, 'rgba(220,190,160,0)');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, W, H);

            const g2 = ctx.createRadialGradient(W - 60, H - 100, 20, W - 60, H - 100, 350);
            g2.addColorStop(0, 'rgba(200,175,150,0.2)');
            g2.addColorStop(1, 'rgba(200,175,150,0)');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, W, H);

            ctx.font = '48px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.globalAlpha = 0.12;
            ctx.fillText('🍂', 80, 140);
            ctx.fillText('🍁', W - 70, 200);
            ctx.fillText('🍂', 100, H - 120);
            ctx.fillText('🍁', W - 80, H - 160);
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(180,150,130,0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([6, 8]);
            ctx.beginPath();
            ctx.moveTo(60, 70);
            ctx.lineTo(W - 60, 70);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#3d2a1b';
            ctx.font = '600 36px "Noto Serif SC", "PingFang SC", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('🍂 秋日诗签', W / 2, 60);

            ctx.fillStyle = '#8b6548';
            ctx.font = '400 18px "Noto Serif SC", serif';
            ctx.textBaseline = 'top';
            ctx.fillText(`✦ 生日 · ${formatBirth(birth)} ✦`, W / 2, 112);

            ctx.strokeStyle = 'rgba(180,150,130,0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(100, 150);
            ctx.lineTo(W - 100, 150);
            ctx.stroke();

            const lines = buildPoem(words);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const startY = 190;
            const lineHeight = 52;
            lines.forEach((line, i) => {
                const isLast = (i === lines.length - 1);
                ctx.fillStyle = isLast ? '#8b6548' : '#3d2a1b';
                ctx.font = isLast ? '600 24px "Noto Serif SC", "PingFang SC", serif' : '500 26px "Noto Serif SC", "PingFang SC", serif';
                ctx.fillText(line, W / 2, startY + i * lineHeight);
            });

            ctx.strokeStyle = 'rgba(180,150,130,0.12)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(120, 430);
            ctx.lineTo(W - 120, 430);
            ctx.stroke();
            ctx.setLineDash([]);

            const logoY = 480;
            ctx.fillStyle = '#b99a82';
            ctx.font = '400 14px "Noto Serif SC", serif';
            ctx.textBaseline = 'top';
            ctx.fillText('✦ 秋日卡牌 · 生日诗签 ✦', W / 2, logoY);

            ctx.fillStyle = '#c9b094';
            ctx.font = '300 12px "Noto Serif SC", serif';
            ctx.textBaseline = 'top';
            ctx.fillText('· 社区 ·', W / 2, logoY + 32);

            ctx.globalAlpha = 0.1;
            ctx.font = '28px serif';
            ctx.textBaseline = 'bottom';
            ctx.fillText('🍂', 50, H - 24);
            ctx.fillText('🍁', W - 50, H - 24);
            ctx.globalAlpha = 1;

            ctx.strokeStyle = 'rgba(180,150,130,0.08)';
            ctx.lineWidth = 2;
            ctx.strokeRect(18, 18, W - 36, H - 36);

            return canvas;
        }

        // ================================================================
        //  事 件 绑 定
        // ================================================================

        birthInput.addEventListener('input', function(e) {
            let val = this.value.replace(/\D/g, '').slice(0, 4);
            this.value = val;
            errorText.classList.remove('show');
            if (val.length === 4) {
                if (isValidDate(val)) {
                    errorText.classList.remove('show');
                    startBtn.disabled = false;
                } else {
                    errorText.classList.add('show');
                    startBtn.disabled = true;
                }
            } else {
                startBtn.disabled = true;
            }
        });

        birthInput.addEventListener('blur', function() {
            let val = this.value;
            if (val.length === 3) {
                val = '0' + val;
                this.value = val;
                if (isValidDate(val)) {
                    errorText.classList.remove('show');
                    startBtn.disabled = false;
                } else {
                    errorText.classList.add('show');
                    startBtn.disabled = true;
                }
            }
        });

        birthInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !startBtn.disabled) {
                startBtn.click();
            }
        });

        startBtn.addEventListener('click', function() {
            const val = birthInput.value.trim();
            if (val.length !== 4) {
                errorText.classList.add('show');
                return;
            }
            if (!isValidDate(val)) {
                errorText.classList.add('show');
                return;
            }
            errorText.classList.remove('show');
            runExperience(val);
        });

        homeBtn.addEventListener('click', goHome);

        shareBtn.addEventListener('click', function() {
            if (!state.isComplete || !state.birth || !state.words) {
                showToast('请先完成翻牌');
                return;
            }
            try {
                generatePoster(state.birth, state.words);
                $('posterOverlay').classList.add('active');
                document.body.style.overflow = 'hidden';
            } catch (err) {
                showToast('生成失败，请重试');
                console.error(err);
            }
        });

        $('posterClose').addEventListener('click', closePoster);
        $('posterOverlay').addEventListener('click', function(e) {
            if (e.target === this) closePoster();
        });

        function closePoster() {
            $('posterOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        $('downloadPoster').addEventListener('click', function() {
            const canvas = $('posterCanvas');
            const link = document.createElement('a');
            link.download = `秋日诗签_${state.birth}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('💾 已保存到相册');
        });

        $('copyPoemBtn').addEventListener('click', function() {
            if (!state.isComplete || !state.words) {
                showToast('请先完成翻牌');
                return;
            }
            const lines = buildPoem(state.words);
            const poemText = lines.join('\n') + `\n\n✦ 生日 · ${formatBirth(state.birth)} ✦`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(poemText).then(() => {
                    showToast('📋 诗歌已复制到剪贴板');
                }).catch(() => {
                    fallbackCopy(poemText);
                });
            } else {
                fallbackCopy(poemText);
            }
        });

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('📋 诗歌已复制到剪贴板');
            } catch (err) {
                showToast('复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        // ================================================================
        //  初 始 化
        // ================================================================
        startBtn.disabled = true;
        console.log('🍂 秋日卡牌 · 生日诗签 已加载（心境避免重复）');
    </script>

</body>
</html>
